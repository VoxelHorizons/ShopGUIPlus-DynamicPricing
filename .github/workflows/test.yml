name: Build and test plugin
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install upstream ShopGUIPlus API compile stubs
        run: |
          git clone --depth 1 https://github.com/brcdev-minecraft/shopgui-api.git /tmp/shopgui-api
          mvn -B -f /tmp/shopgui-api/pom.xml -DBUILD_VERSION=1.0-local -DskipTests install
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicPricing-plugin
          path: target/shopguiplus-dynamicpricing-*.jar
